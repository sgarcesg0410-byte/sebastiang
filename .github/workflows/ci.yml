name: CI Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Principio de mínimo privilegio para GITHUB_TOKEN (Hallazgo B8)
permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Comprehensive backend syntax check
        run: npm run check:syntax

      - name: Run automated tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Security audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      - name: SAST & Secret Hardening Gate (Zero PII / Zero Weak Secrets)
        run: |
          node -e "
            const fs = require('fs');
            const apiSec = fs.readFileSync('api/security.js', 'utf8');
            const apiIdx = fs.readFileSync('api/index.js', 'utf8');
            const emailSvc = fs.readFileSync('api/emailService.js', 'utf8');
            if (apiSec.includes('5eb11bf58cb9eb8ad63d3dcac1e264ecda98bd97d56b4d16ea19b73d0d7584c3')) {
              throw new Error('SAST: Hardcoded weak PIN SHA-256 hash found in api/security.js');
            }
            if (apiSec.includes('0493')) {
              throw new Error('SAST: Direct literal weak PIN \"0493\" found in api/security.js');
            }
            if (emailSvc.includes('sgarcesg0410@gmail.com') || apiIdx.includes('bc62cb00-9782-4a8e-a344-e8cf031a211a')) {
              throw new Error('SAST: Hardcoded personal email or OneSignal App ID found in backend');
            }
            console.log('✓ SAST security gate passed');
          "

  codeql-sast:
    name: CodeQL Deep Taint-Tracking SAST
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize CodeQL (javascript-typescript)
        uses: github/codeql-action/init@f1f6e5f6af878fb37dc8fa8febc4bd5f4ed0b7a7 # v3.28.0
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Perform CodeQL Taint-Tracking Analysis
        uses: github/codeql-action/analyze@f1f6e5f6af878fb37dc8fa8febc4bd5f4ed0b7a7 # v3.28.0
        with:
          category: "/language:javascript-typescript"
